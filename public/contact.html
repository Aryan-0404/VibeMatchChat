<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | VibeMatchChat</title>
    <meta name="description" content="Get in touch with VibeMatchChat. Contact us via email or follow us on social media.">
    <meta name="keywords" content="Contact VibeMatchChat, Anonymous Chat Support, Chat Help, VibeMatchChat Social Media">
    <meta name="robots" content="index, follow">
    <style>
        /* General Styling */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        /* Contact Card */
        .contact-container {
            max-width: 500px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }

        .contact-container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #222;
        }

        p {
            font-size: 16px;
            margin: 10px 0;
        }

        /* Email Section */
        .email {
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
            display: inline-block;
            margin-top: 5px;
            transition: color 0.3s;
        }

        .email:hover {
            color: #0056b3;
        }

        /* Social Media Links */
        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            display: inline-block;
            margin: 10px;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 16px;
            text-decoration: none;
            transition: 0.3s;
            font-weight: bold;
        }

        .twitter { background: #1DA1F2; color: white; }
        .instagram { background: #E1306C; color: white; }
        .facebook { background: #1877F2; color: white; }

        .social-links a:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        /* Back to Home Button */
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>Contact Us</h1>
        <p>Have any questions? We're here to help!</p>
        
        <p><strong>Email:</strong> 
            <a href="mailto:support@VibeMatchChat.com" class="email">support@VibeMatchChat.com</a>
        </p>

        <h2>Follow Us</h2>
        <div class="social-links">
            <a href="#" class="twitter">Twitter</a>
            <a href="https://www.instagram.com/invites/contact/?igsh=11wqzrrr72boo&utm_content=w1164n3" class="instagram">Instagram</a>
            <a href="#" class="facebook">Facebook</a>
        </div>

        <a href="index.html" class="back-btn">Back to Home</a>
    </div>

</body>
</html>
